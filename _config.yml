title: Kuda Savanhu
tagline: Developer & Cybersecurity Researcher # short homepage <title> suffix (seo-tag)
description: >-
  Security research and vulnerability write-ups by Kuda Savanhu — CVE deep dives,
  web application penetration testing, and full-stack development notes.
url: "https://kudasav.com" # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog
lang: en

# --- SEO (jekyll-seo-tag) ---
author:
  name: Kuda Savanhu

# Default Open Graph / Twitter share image used when a page sets none of its own
image: /assets/img/profile.jpg
logo: /assets/img/profile.jpg # used as the publisher logo in BlogPosting JSON-LD

# Default meta keywords (a post's own `keywords:` or `tags:` override this)
keywords: cybersecurity, security research, vulnerability research, penetration testing, CVE, web application security, ethical hacking

social:
  name: Kuda Savanhu
  links: # rendered as sameAs in the Person structured data
    - https://www.linkedin.com/in/kuda-savanhu
    - https://github.com/kudasav
    - https://hackerone.com/kudasav

# Emit BlogPosting structured data + default fields for every post
defaults:
  - scope:
      path: ""
      type: posts
    values:
      seo:
        type: BlogPosting

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - README.md
  - node_modules
  - _webpack
  - tailwind.config.js
  - postcss.config.js
  - webpack.config.js
  - package.json
  - pacakge-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
