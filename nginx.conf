server {
    listen       4000;
    listen  [::]:4000;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # This container runs behind a TLS-terminating reverse proxy (Coolify/Traefik),
    # so nginx only ever sees plain http on port 4000. Emit RELATIVE redirects and
    # never inject the listen port, otherwise a request to "/blog" gets 301'd to
    # "http://host:4000/blog/" — leaking the internal port and downgrading from https.
    absolute_redirect off;
    port_in_redirect  off;

    # --- Compression ---
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/atom+xml application/rss+xml
                    application/manifest+json;

    # Serve the PWA manifest with the correct media type (nginx's default
    # mime.types does not map the .webmanifest extension).
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header   Cache-Control "public, max-age=0, must-revalidate";
    }

    # Cache static assets. Filenames are NOT content-hashed, so use a moderate TTL
    # (not "immutable") to avoid serving stale CSS/JS after a deploy. Switch to a
    # longer TTL once webpack emits [contenthash] filenames.
    location ~* \.(?:css|js|png|jpe?g|gif|ico|svg|webp|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # Serve files, then directory index, then the .html for extensionless URLs.
    # HTML is revalidated on each load so content/SEO updates go live immediately.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    error_page 404 /404.html;
}
